[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quartet-companion"
version = "0.1.0"
description = "Listening guides for string chamber music: score analysis, score-to-recording alignment, and fact-checked explanations."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "librosa>=0.10",
  "soundfile>=0.12",
  "numba>=0.58",
  "music21>=9.1",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "pypdfium2>=4.0",
  "noisereduce>=3.0",
  "verovio>=4.0",
  "mido>=1.3",
  "scipy>=1.10",
  "pillow>=9",
  "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
qc = "quartet_companion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["slow: needs audio or long runs", "api: calls the Anthropic API (costs money)"]
addopts = "-m 'not api'"

[tool.setuptools.package-data]
quartet_companion = ["web/*", "studio_web/*"]
